[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amkb"
dynamic = ["version"]
description = "Backend-agnostic Python SDK and conformance suite for the AMKB protocol"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "takyone" }]
keywords = ["amkb", "knowledge-base", "rag", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "amkb[test]",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Specification = "https://github.com/takyone/amkb-spec"
Repository = "https://github.com/takyone/amkb-sdk"
Issues = "https://github.com/takyone/amkb-sdk/issues"
Changelog = "https://github.com/takyone/amkb-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/amkb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amkb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Capitalized `test_L1_*` names are deliberate — they mirror the
# amkb-spec conformance matrix IDs one-to-one.
"src/amkb/conformance/test_*.py" = ["N802"]
# `EInvalid`-style names mirror the spec's canonical error codes
# (§5.4), not Python's `*Error` exception-naming convention.
"src/amkb/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
